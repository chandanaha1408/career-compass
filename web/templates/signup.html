{% extends "base.html" %}{% block title %}Create account{% endblock %}
{% block content %}<section class="narrow auth"><h1>Create your account</h1>
<form method="post">{{ csrf_field() }}
<label>Name<input name="name" required autocomplete="name" value="{{ request.form.name }}"></label>
<label>Email<input type="email" name="email" required autocomplete="email" value="{{ request.form.email }}"></label>
<label>Password<input type="password" name="password" required minlength="6" autocomplete="new-password"></label>
<button class="btn">Create account</button></form>
<p>Already have an account? <a href="{{ url_for('auth.login') }}">Log in</a></p></section>{% endblock %}
