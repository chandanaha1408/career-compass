{% extends "base.html" %}{% block title %}Log in{% endblock %}
{% block content %}<section class="narrow auth"><h1>Log in</h1>
<form method="post">{{ csrf_field() }}
<label>Email<input type="email" name="email" required autocomplete="email" value="{{ request.form.email }}"></label>
<label>Password<input type="password" name="password" required autocomplete="current-password"></label>
<button class="btn">Log in</button></form>
<p>New here? <a href="{{ url_for('auth.signup') }}">Create an account</a></p></section>{% endblock %}
